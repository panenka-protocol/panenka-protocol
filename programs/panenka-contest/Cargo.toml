[package]
name = "panenka-contest"
version = "0.1.0"
description = "Panenka Protocol - skill-based staked FPL contests, programmatic settlement"
edition = "2021"
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]
name = "panenka_contest"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
solana-program = "=1.18.26"
